# ==========================
#   Hiroki 用 Starship
# ==========================

# 1行目: パス + Git
# 2行目: 言語 & Docker 情報
# 3行目: プロンプト記号
# format = """
# $directory$git_branch$git_status
# $nodejs$python$rust$golang$docker_context
# $character
# """
# 1行目: ユーザー + ホスト + パス + Git
# 2行目: 言語 & Docker 情報
# 3行目: プロンプト記号

add_newline = false

# format = """
# 
# $username$hostname$directory$git_branch$git_status
# $nodejs$python$rust$golang$docker_context
# $character
# """
format = "\n[╭─](fg:#666666) $username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$docker_context\n[╰──](fg:#666666)$character"

# ===== Hostname（PC名）を表示 =====
[hostname]
format = "[$hostname]($style) "
style = "bold #8a5fe2"
ssh_only = false
disabled = false
# ===== Username（ユーザー名）を表示 =====
[username]
style_user = "bold #6c4cff"    # 薄めの青紫
style_root = "bold #d875ff"    # 明るめ紫アクセント
format = "[$user]($style) "
disabled = false
show_always = true


# ===== プロンプト記号 =====
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vicmd_symbol   = "[❮](bold yellow)"

# ===== カレントディレクトリ =====
[directory]
style = "white"
truncate_to_repo = true
truncation_length = 3
read_only = " "

# ===== Git Branch =====
[git_branch]
symbol = " "
style = "bold purple"
format = " [$symbol$branch]($style)"

# ===== Git Status =====
[git_status]
style = "bold yellow"
conflicted = " ⚠"
ahead      = " ⇡${count}"
behind     = " ⇣${count}"
modified   = " ✚${count}"
staged     = " ●${count}"
untracked  = " …${count}"

# ===== Node.js =====
[nodejs]
symbol = " "
style = "bold green"
format = " [$symbol$version]($style)"

# ===== Python =====
[python]
symbol = " "
style = "bold green"
format = " [$symbol$version]($style)"

# ===== Rust =====
[rust]
symbol = "🦀 "
style = "bold red"
format = " [$symbol$version]($style)"

# ===== Go =====
[golang]
symbol = " "
style = "bold cyan"
format = " [$symbol$version]($style)"

# ===== Docker =====
[docker_context]
symbol = " "
style = "bold blue"
format = " [$symbol$context]($style)"

# ===== 時間（必要なら） =====
[time]
disabled = true
# enable するなら:
# disabled = false
# format = " [ $time]($style)"
# time_format = "%H:%M"
# style = "dimmed white"

